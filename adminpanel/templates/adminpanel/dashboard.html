{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Lucide icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="icon" href="{% static 'images/favicon.ico' %}">

<style>
:root{
  --bg-dark:#0f172a;
  --brand:#0ea5a4;
  --accent:#7c3aed;
  --text-primary:#e5e7eb;
  --text-muted:#94a3b8;
}

/* Full-page layout */
body, html { margin:0; padding:0; height:100%; overflow:hidden; font-family:'Inter',system-ui,sans-serif; }

/* Animated Gradient Background */
body {
  position: relative;
  background: linear-gradient(-45deg, #0f172a, #1e293b, #0f172a, #1e293b);
  background-size: 400% 400%;
  animation: gradientBG 20s ease infinite;
  display: flex;
  color: var(--text-primary);
}

/* Background animation */
@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Floating circles */
body::before {
  content:'';
  position:absolute;
  width:120vw;
  height:120vh;
  background:radial-gradient(circle at 20% 30%, rgba(14,165,164,0.15), transparent 60%), radial-gradient(circle at 80% 70%, rgba(124,58,237,0.15), transparent 60%);
  top: -10vh;
  left:-10vw;
  z-index:0;
  animation: floatShapes 25s linear infinite alternate;
}

@keyframes floatShapes {
  0%{ transform: translate(0,0) rotate(0deg); }
  50%{ transform: translate(20px, 30px) rotate(45deg); }
  100%{ transform: translate(-20px, 20px) rotate(-30deg); }
}

/* Sidebar */
.sidebar {
  position: relative; z-index:10;
  width: 280px;
  padding: 2rem 1.5rem;
  display: flex; flex-direction: column; gap: 2rem;
  backdrop-filter: blur(12px);
  background: rgba(15,23,42,0.6);
  border-radius: 1rem;
}

/* Sidebar brand & nav */
.sidebar .brand { display: flex; align-items:center; gap:0.75rem; }
.sidebar .brand img { width:44px; height:44px; border-radius:0.5rem; }
.sidebar nav a {
  display:flex; align-items:center; gap:0.75rem;
  padding:0.5rem 0.75rem; border-radius:0.5rem;
  color: var(--text-primary); font-weight:500; text-decoration:none;
  transition: all 0.3s ease;
}
.sidebar nav a:hover {
  background: linear-gradient(90deg, var(--brand), var(--accent));
  color: #fff;
  transform: translateX(4px);
}
.sidebar-active {
  background: linear-gradient(90deg, var(--brand), var(--accent));
  color:#fff;
  font-weight:600;
}

/* Main content */
.main-content { flex:1; display:flex; flex-direction:column; position:relative; z-index:10; }

/* Topbar */
.topbar {
  display:flex; justify-content:flex-end; align-items:center;
  padding:1rem 2rem; gap:1rem;
  backdrop-filter: blur(12px);
  background: rgba(15,23,42,0.5);
  border-radius:1rem;
}

/* Logout */
.btn-logout {
  display:flex; align-items:center; gap:0.5rem;
  background: linear-gradient(90deg, var(--accent), var(--brand));
  padding:0.5rem 1rem; border-radius:0.5rem; font-weight:600;
  transition: all 0.3s ease;
}
.btn-logout:hover { transform: translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,0.5); }

/* Greeting */
.greeting {
  background: linear-gradient(135deg, var(--brand), var(--accent));
  color:#fff;
  padding:1.5rem;
  border-radius:1rem;
  box-shadow:0 10px 28px rgba(0,0,0,0.5);
  margin:1rem 2rem;
}

/* Metrics */
.metrics {
  display:grid; grid-template-columns: repeat(4,1fr);
  gap:1rem; margin:1rem 2rem;
}
.metric-card {
  display:flex; justify-content:space-between; align-items:center;
  padding:1rem; border-radius:0.75rem;
  background: rgba(255,255,255,0.05);
  transition: all 0.3s ease;
}
.metric-card:hover {
  transform: translateY(-3px);
  box-shadow:0 12px 24px rgba(0,0,0,0.4);
  background: linear-gradient(135deg, var(--brand), var(--accent));
}
.metric-card i { font-size:2rem; }
</style>
</head>

<body>

<!-- Sidebar -->
<aside class="sidebar glass">
  <div class="brand">
    <img src="{% static 'images/favicon.ico' %}" alt="logo">
    <div>
      <div class="font-bold text-lg">Grievance Admin</div>
      <div class="text-sm text-muted">Control Panel</div>
    </div>
  </div>

  <nav>
    <a href="{% url 'adminpanel:dashboard' %}" class="sidebar-active"><i data-lucide="home"></i> Dashboard</a>
    <a href="{% url 'adminpanel:grievances_list' %}"><i data-lucide="file-text"></i> Grievances</a>
    <a href="{% url 'adminpanel:analytics' %}"><i data-lucide="bar-chart-2"></i> Analytics</a>
    <a href="{% url 'adminpanel:users' %}"><i data-lucide="users"></i> Users</a>
    <a href="{% url 'adminpanel:categories' %}"><i data-lucide="tag"></i> Categories</a>
    <a href="{% url 'adminpanel:settings' %}"><i data-lucide="settings"></i> Settings</a>
  </nav>
</aside>

<!-- Main Content -->
<div class="main-content flex-1">

  <!-- Topbar -->
  <div class="topbar glass">
    <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}
      <button type="submit" class="btn-logout">
        <i data-lucide="log-out"></i> Sign Out
      </button>
    </form>
  </div>

  <!-- Greeting -->
  <div class="greeting">
    <h2 class="text-2xl font-bold">Welcome back, {{ request.user.username }} 👋</h2>
    <p class="mt-1 text-white/80">Review the metrics below to keep track of system activity.</p>
  </div>

  <!-- Metrics -->
  <div class="metrics">
    <div class="metric-card glass">
      <div>
        <div class="text-muted text-sm">Total Grievances</div>
        <div id="total" class="text-xl font-bold mt-1">0</div>
      </div>
      <i data-lucide="file-text"></i>
    </div>

    <div class="metric-card glass">
      <div>
        <div class="text-muted text-sm">Pending</div>
        <div id="pending" class="text-xl font-bold mt-1 text-yellow-400">0</div>
      </div>
      <i data-lucide="clock"></i>
    </div>

    <div class="metric-card glass">
      <div>
        <div class="text-muted text-sm">In Progress</div>
        <div id="progress" class="text-xl font-bold mt-1 text-teal-400">0</div>
      </div>
      <i data-lucide="refresh-cw"></i>
    </div>

    <div class="metric-card glass">
      <div>
        <div class="text-muted text-sm">Resolved</div>
        <div id="resolved" class="text-xl font-bold mt-1 text-green-400">0</div>
      </div>
      <i data-lucide="check-circle"></i>
    </div>
  </div>

</div>

<canvas id="particles" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;"></canvas>

<script>
lucide.createIcons();

// ====================
// Particle Background
// ====================
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

for(let i=0;i<80;i++){
  particles.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*3+1,
    dx: (Math.random()-0.5)*0.3,
    dy: (Math.random()-0.5)*0.3,
    color: `rgba(255,255,255,${Math.random()*0.2+0.05})`
  });
}

function animateParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let p of particles){
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.fill();
    p.x += p.dx; p.y += p.dy;
    if(p.x<0||p.x>canvas.width) p.dx*=-1;
    if(p.y<0||p.y>canvas.height) p.dy*=-1;
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();

// ====================
// Fetch metrics from API & count-up
// ====================
const API_BASE = '/adminpanel/api/'; // adjust if needed

async function loadMetrics(){
  try{
    const res = await fetch(`${API_BASE}analytics/`);
    if(!res.ok) throw new Error('API fetch failed');
    const data = await res.json();

    animateCount('total', data.total ?? 0);
    animateCount('pending', data.pending ?? 0);
    animateCount('progress', data.in_progress ?? 0);
    animateCount('resolved', data.resolved ?? 0);
  } catch(err){
    console.error('Error loading metrics:', err);
  }
}

// Count-up animation
function animateCount(id, target){
  const el = document.getElementById(id);
  const duration = 1500;
  const start = 0;
  const stepTime = Math.max(Math.floor(duration / target), 20);
  let current = start;
  const timer = setInterval(()=>{
    current += 1;
    el.textContent = current;
    if(current >= target){
      el.textContent = target;
      clearInterval(timer);
    }
  }, stepTime);
}

loadMetrics();
</script>

</body>
</html>
