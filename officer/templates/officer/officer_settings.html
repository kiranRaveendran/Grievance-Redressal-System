{% extends "officer/base_officer.html" %}
{% load static %}

{% block content %}

<div class="flex justify-center items-start mt-10 px-4">
  <div class="w-full max-w-3xl bg-slate-900/90 backdrop-blur
              border border-white/10 rounded-2xl shadow-2xl p-8">

    <!-- TITLE -->
    <div class="mb-8">
      <h2 class="text-2xl font-bold text-white">Account Settings</h2>
      <p class="text-gray-400 mt-1">Manage your profile and security</p>
    </div>

    <!-- ================= PROFILE ================= -->
    <div class="mb-10">
      <h3 class="text-lg font-semibold text-gray-200 mb-4">👤 Profile</h3>

      <div class="space-y-4">
        <input type="hidden" id="csrf_token" value="{{ csrf_token }}">

        <div>
          <label class="text-sm text-gray-300">Name</label>
          <input type="text" id="name"
                 value="{{ request.user.first_name }}"
                 class="w-full mt-1 px-4 py-2 bg-slate-800 border border-white/10
                        text-white rounded-lg focus:ring focus:ring-blue-500/30">
        </div>

        <div class="text-right">
          <button type="button" id="profileBtn"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg">
            Update Profile
          </button>
        </div>
      </div>
    </div>

    <!-- ================= PASSWORD ================= -->
    <div>
      <h3 class="text-lg font-semibold text-gray-300 mb-4">🔐 Change Password</h3>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-sm text-gray-300">Old Password</label>
          <input type="password" id="old_password"
                 class="w-full mt-1 px-4 py-2 bg-slate-800 border border-white/10
                        text-white rounded-lg">
        </div>

        <div>
          <label class="text-sm text-gray-300">New Password</label>
          <input type="password" id="new_password"
                 class="w-full mt-1 px-4 py-2 bg-slate-800 border border-white/10
                        text-white rounded-lg">
        </div>

        <div class="md:col-span-2 text-right">
          <button type="button" id="passwordBtn"
            class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg">
            Change Password
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ================= JAVASCRIPT ================= -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  /* ===== GET CSRF TOKEN SAFELY ===== */
  function getCSRFToken() {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
      const cookies = document.cookie.split(";");
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.startsWith("csrftoken=")) {
          cookieValue = decodeURIComponent(cookie.substring("csrftoken=".length));
          break;
        }
      }
    }
    return cookieValue;
  }

  /* ===== PROFILE UPDATE ===== */
  document.getElementById("profileBtn").addEventListener("click", async () => {
    const name = document.getElementById("name").value.trim();

    if (!name) {
      alert("Name cannot be empty");
      return;
    }

    try {
      const res = await fetch("/officer/settings/api/profile/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCSRFToken(),
        },
        credentials: "same-origin",
        body: JSON.stringify({ name }),
      });

      let data = {};
      try {
        data = await res.json();
      } catch (e) {
        console.error("Non-JSON response:", e);
      }

      console.log("Profile API response:", res.status, data);

      if (!res.ok) {
        alert(data.error || `Profile update failed (${res.status})`);
        return;
      }

      alert(data.message || "Profile updated successfully");

      const navName = document.getElementById("navbarUserName");
      if (navName) navName.innerText = data.first_name || name;

    } catch (err) {
      console.error(err);
      alert("Profile update failed");
    }
  });

  /* ===== CHANGE PASSWORD ===== */
  document.getElementById("passwordBtn").addEventListener("click", async () => {
    const old_password = document.getElementById("old_password").value.trim();
    const new_password = document.getElementById("new_password").value.trim();

    if (!old_password || !new_password) {
      alert("Please enter both old and new passwords");
      return;
    }

    try {
      const res = await fetch("/officer/settings/api/change-password/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCSRFToken(),
        },
        credentials: "same-origin",
        body: JSON.stringify({ old_password, new_password })
      });

      let data = {};
      try {
        data = await res.json();
      } catch (e) {
        console.error("Non-JSON response:", e);
      }

      console.log("Password API response:", res.status, data);

      if (!res.ok) {
        alert(data.error || `Password change failed (${res.status})`);
        return;
      }

      alert(data.message || "Password changed successfully");
      window.location.href = "/login/";

    } catch (err) {
      console.error(err);
      alert("Password change failed");
    }
  });

});
</script>


{% endblock %}
