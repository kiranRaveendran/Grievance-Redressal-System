{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin | Grievances</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
body{
  background:
    radial-gradient(circle at top,#14b8a633,transparent 45%),
    linear-gradient(180deg,#020617,#031f1c);
  color:#e5e7eb;
  font-family:Inter,system-ui;
  overflow:hidden;
}
.glass{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(16px);
}
.card{transition:.3s}
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 25px 50px rgba(0,0,0,.6);
}
.badge{
  padding:.25rem .6rem;
  border-radius:.5rem;
  font-size:.75rem;
  text-transform:capitalize;
}
.b-new{background:#f59e0b22;color:#fbbf24}
.b-in_progress{background:#0ea5a422;color:#2dd4bf}
.b-resolved{background:#10b98122;color:#34d399}
</style>
</head>

<body>
<div class="flex h-screen">

<!-- ================= SIDEBAR ================= -->
<aside class="w-72 p-6 hidden md:flex flex-col glass">
  <div class="flex items-center gap-3 mb-8">
    <div class="w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center">
      <img src="{% static 'images/favicon.ico' %}" class="w-8 h-8">
    </div>
    <div>
      <div class="font-bold text-lg">Admin Panel</div>
      <div class="text-xs text-gray-400">Grievance System</div>
    </div>
  </div>

<nav class="space-y-2 flex-1">
  <a href="{% url 'adminpanel:dashboard' %}"
     class="flex items-center gap-3 px-4 py-2 rounded hover:bg-white/10">
    <i data-lucide="layout-dashboard"></i> Dashboard
  </a>

  <a href="{% url 'adminpanel:grievances_list' %}"
     class="flex items-center gap-3 px-4 py-2 rounded bg-white/10">
    <i data-lucide="file-text"></i> Grievances
  </a>

  <a href="{% url 'adminpanel:users' %}"
     class="flex items-center gap-3 px-4 py-2 rounded hover:bg-white/10">
    <i data-lucide="users"></i> Users
  </a>

  <a href="{% url 'adminpanel:categories' %}"
     class="flex items-center gap-3 px-4 py-2 rounded hover:bg-white/10">
    <i data-lucide="layers"></i> Categories
  </a>

  <a href="{% url 'adminpanel:analytics' %}"
     class="flex items-center gap-3 px-4 py-2 rounded hover:bg-white/10">
    <i data-lucide="bar-chart-2"></i> Analytics
  </a>

  <a href="{% url 'adminpanel:settings' %}"
     class="flex items-center gap-3 px-4 py-2 rounded hover:bg-white/10">
    <i data-lucide="settings"></i> Settings
  </a>
</nav>


  <form method="post" action="{% url 'accounts:logout' %}">
    {% csrf_token %}
    <button class="w-full flex items-center gap-2 px-4 py-2 rounded bg-red-500/20 hover:bg-red-500/30">
      <i data-lucide="log-out"></i> Sign Out
    </button>
  </form>
</aside>

<!-- ================= MAIN ================= -->
<main class="flex-1 p-6 overflow-hidden">

<h1 class="text-2xl font-bold mb-6">Grievance Overview</h1>

<!-- ================= METRICS ================= -->
<div class="grid grid-cols-3 gap-6 mb-6">
  <div class="glass p-5 rounded-xl">
    <div class="flex items-center gap-2 text-gray-400">
      <i data-lucide="layers"></i>Total
    </div>
    <h2 id="total" class="text-3xl font-bold">0</h2>
  </div>

  <div class="glass p-5 rounded-xl">
    <div class="flex items-center gap-2 text-yellow-400">
      <i data-lucide="alert-circle"></i>Open
    </div>
    <h2 id="open" class="text-3xl font-bold text-yellow-400">0</h2>
  </div>

  <div class="glass p-5 rounded-xl">
    <div class="flex items-center gap-2 text-green-400">
      <i data-lucide="check-circle"></i>Resolved
    </div>
    <h2 id="resolved" class="text-3xl font-bold text-green-400">0</h2>
  </div>
</div>

<!-- ================= TABLE ================= -->
<div class="glass rounded-xl overflow-hidden">
<table class="w-full text-sm">
<thead class="bg-white/5 text-gray-400">
<tr>
  <th class="px-4 py-3 text-left">ID</th>
  <th>Title</th>
  <th>User</th>
  <th>Status</th>
  <th>Officer</th>
  <th class="text-center">Action</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>

</main>
</div>

<!-- ================= ASSIGN MODAL ================= -->
<div id="assignModal"
     class="fixed inset-0 hidden bg-black/60 flex items-center justify-center z-50">
  <div class="glass p-6 rounded-xl w-96">
    <h3 class="font-semibold mb-4 flex items-center gap-2">
      <i data-lucide="user-check"></i> Assign Officer
    </h3>

    <select id="officerSelect"
      class="w-full p-2 rounded bg-black/40 border border-white/10 mb-4">
    </select>

    <div class="flex justify-end gap-2">
      <button onclick="closeModal()"
              class="px-4 py-1 bg-white/10 rounded">
        Cancel
      </button>
      <button onclick="assignOfficer()"
              class="px-4 py-1 bg-teal-500 rounded text-black">
        Assign
      </button>
    </div>
  </div>
</div>

<!-- ================= SCRIPT ================= -->
<script>
let currentGrievanceId=null;
let openCount=0,resCount=0;

/* LOAD GRIEVANCES */
fetch('/adminpanel/api/grievances/')
.then(r=>r.json())
.then(d=>{
  document.getElementById('total').textContent=d.count;
  const tbody=document.getElementById('rows');

  d.results.forEach(g=>{
    g.status==='resolved' ? resCount++ : openCount++;

    const officerName = g.assigned_officer
      ? `<span class="text-teal-400 flex items-center gap-1">
           <i data-lucide="user"></i>${g.assigned_officer.username}
         </span>`
      : `<span class="text-gray-500">Unassigned</span>`;

    const viewBtn = `
      <a href="/adminpanel/grievances/${g.id}/"
         class="px-3 py-1 rounded bg-indigo-500/20 hover:bg-indigo-500/30
                flex items-center gap-1">
        <i data-lucide="eye"></i> View
      </a>`;

    const assignBtn = g.assigned_officer
      ? `<button onclick="openModal(${g.id})"
           class="px-3 py-1 rounded bg-yellow-500/20 hover:bg-yellow-500/30
                  flex items-center gap-1">
           <i data-lucide="refresh-cw"></i> Reassign
         </button>`
      : `<button onclick="openModal(${g.id})"
           class="px-3 py-1 rounded bg-teal-500/20 hover:bg-teal-500/30
                  flex items-center gap-1">
           <i data-lucide="user-plus"></i> Assign
         </button>`;

    tbody.innerHTML+=`
      <tr class="border-t border-white/10 hover:bg-white/5">
        <td class="px-4 py-2">${g.id}</td>
        <td>${g.title}</td>
        <td>${g.user?.username||'-'}</td>
        <td><span class="badge b-${g.status}">${g.status}</span></td>
        <td>${officerName}</td>
        <td class="text-center">
          <div class="flex justify-center gap-2">
            ${viewBtn}
            ${assignBtn}
          </div>
        </td>
      </tr>`;
  });

  document.getElementById('open').textContent=openCount;
  document.getElementById('resolved').textContent=resCount;
  lucide.createIcons();
});

/* LOAD OFFICERS */
fetch('/adminpanel/api/user-status/')
.then(r=>r.json())
.then(data=>{
  const sel=document.getElementById('officerSelect');
  sel.innerHTML='<option value="">Select Officer</option>';
  data.officers.forEach(o=>{
    sel.innerHTML+=`<option value="${o.id}">
      ${o.full_name || o.username}
    </option>`;
  });
});

function openModal(id){
  currentGrievanceId=id;
  document.getElementById('assignModal').classList.remove('hidden');
}
function closeModal(){
  document.getElementById('assignModal').classList.add('hidden');
}

/* ASSIGN OFFICER */
function assignOfficer(){
  const officer=document.getElementById('officerSelect').value;
  if(!officer){ alert('Select officer'); return; }

  fetch(`/adminpanel/api/grievances/${currentGrievanceId}/assign/`,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'X-CSRFToken':'{{ csrf_token }}'
    },
    body:JSON.stringify({assigned_officer:Number(officer)})
  }).then(()=>location.reload());
}

lucide.createIcons();
</script>

</body>
</html>
