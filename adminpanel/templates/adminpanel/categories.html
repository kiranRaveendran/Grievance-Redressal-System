{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel — Categories</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="icon" href="{% static 'images/favicon.ico' %}">

<style>
:root{
  --bg-1:#0a1f2f;
  --bg-2:#071426;
  --card-bg:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.08);
}
body{
  background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
  color:#e6eef3;
  font-family:Inter,system-ui;
}
.sidebar{
  width:260px;
  position:fixed;
  inset:0 auto 0 0;
  background:var(--card-bg);
  border-right:1px solid var(--border);
}
.main{
  margin-left:260px;
  padding:24px;
}
.card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:16px;
}
.nav a{
  display:flex;
  gap:12px;
  padding:10px 14px;
  border-radius:10px;
  color:#9fb6c2;
  text-decoration:none;
}
.nav a.active,.nav a:hover{
  background:rgba(255,255,255,.05);
  color:#fff;
}
.table-card{
  overflow:auto;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:12px;
  border-bottom:1px solid var(--border);
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 10px;
  border-radius:999px;
  font-size:.8rem;
  font-weight:600;
}

/* Badge colors */
.badge.hr{background:rgba(34,197,94,.2);color:#22c55e;}
.badge.it{background:rgba(59,130,246,.2);color:#3b82f6;}
.badge.finance{background:rgba(245,158,11,.2);color:#f59e0b;}
.badge.admin{background:rgba(168,85,247,.2);color:#a855f7;}
.badge.default{background:rgba(148,163,184,.2);color:#94a3b8;}

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.6);
}
.modal.show{display:flex}
input,select{
  width:100%;
  background:#0c2035;
  border:1px solid var(--border);
  padding:10px;
  border-radius:12px;
}
</style>
</head>

<body>
<div class="sidebar p-5">
  <div class="flex items-center gap-3 mb-6">
    <img src="{% static 'images/favicon.ico' %}" width="36">
    <span class="font-bold text-lg">Admin</span>
  </div>
  <nav class="nav flex flex-col gap-2">
    <a href="{% url 'adminpanel:dashboard' %}"><i data-lucide="home"></i>Dashboard</a>
    <a href="{% url 'adminpanel:grievances_list' %}"><i data-lucide="file-text"></i>Grievances</a>
    <a href="{% url 'adminpanel:users' %}"><i data-lucide="users"></i>Users</a>

    <!-- SINGLE clean icon for Categories -->
    <a class="active" href="{% url 'adminpanel:categories' %}">
      <i data-lucide="tag"></i>Categories
    </a>

    <a href="{% url 'adminpanel:analytics' %}"><i data-lucide="bar-chart-2"></i>Analytics</a>
    <a href="{% url 'adminpanel:settings' %}"><i data-lucide="settings"></i>Settings</a>
  </nav>
</div>

<main class="main">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold">Manage Categories</h2>
    <button id="addBtn"
      class="px-5 py-2 rounded-lg bg-gradient-to-r from-cyan-400 to-teal-500 text-black font-semibold flex gap-2">
      <i data-lucide="plus"></i>Add Category
    </button>
  </div>

  <div class="card table-card p-4">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Department</th><th class="text-right">Actions</th>
        </tr>
      </thead>
      <tbody id="categoryBody">
        <tr><td colspan="4" class="text-center opacity-70">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Modal -->
<div id="categoryModal" class="modal">
  <div class="card p-6 w-full max-w-md">
    <h3 id="modalTitle" class="text-xl font-bold mb-4">Add Category</h3>
    <input id="categoryName" placeholder="Category name" class="mb-3">
    <select id="categoryDept"></select>
    <div class="flex justify-end gap-3 mt-6">
      <button onclick="hideModal()">Cancel</button>
      <button id="modalSave"
        class="px-4 py-2 rounded bg-gradient-to-r from-cyan-400 to-teal-500 text-black">
        Save
      </button>
    </div>
  </div>
</div>

<script>
lucide.createIcons();

const API_CATEGORIES='/adminpanel/api/categories/';
const API_DEPTS='/adminpanel/api/departments/';
let categories=[],departments=[],editingId=null;

function badgeClass(name){
  name=name?.toLowerCase()||'';
  if(name.includes('hr'))return'hr';
  if(name.includes('it'))return'it';
  if(name.includes('finance'))return'finance';
  if(name.includes('admin'))return'admin';
  return'default';
}

function showModal(){categoryModal.classList.add('show')}
function hideModal(){categoryModal.classList.remove('show')}

addBtn.onclick=()=>{editingId=null;showModal()}

async function loadDepartments(){
  const r=await fetch(API_DEPTS);
  departments=await r.json();
  categoryDept.innerHTML='<option value="">Select department</option>';
  departments.forEach(d=>{
    categoryDept.innerHTML+=`<option value="${d.id}">${d.name}</option>`;
  });
}

async function loadCategories(){
  const r=await fetch(API_CATEGORIES);
  categories=await r.json();
  categoryBody.innerHTML='';
  categories.forEach(c=>{
    const dept=c.department?.name||'-';
    const cls=badgeClass(dept);
    categoryBody.innerHTML+=`
      <tr>
        <td>${c.id}</td>
        <td>${c.name}</td>
        <td>
          <span class="badge ${cls}">
            <i data-lucide="circle-dot" class="w-3 h-3"></i>${dept}
          </span>
        </td>
        <td class="text-right">
          <button onclick="editCat(${c.id})"><i data-lucide="edit"></i></button>
          <button onclick="delCat(${c.id})"><i data-lucide="trash"></i></button>
        </td>
      </tr>`;
  });
  lucide.createIcons();
}

modalSave.onclick=async()=>{
  const payload={name:categoryName.value,department:categoryDept.value};
  await fetch(API_CATEGORIES,{
    method:'POST',
    headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},
    body:JSON.stringify(payload)
  });
  hideModal();loadCategories();
}

function editCat(id){
  const c=categories.find(x=>x.id===id);
  editingId=id;
  categoryName.value=c.name;
  categoryDept.value=c.department.id;
  showModal();
}

function delCat(id){
  if(confirm('Delete category?'))
    fetch(API_CATEGORIES+id+'/',{method:'DELETE',headers:{'X-CSRFToken':getCookie('csrftoken')}})
    .then(loadCategories);
}

function getCookie(n){
  return document.cookie.split('; ').find(r=>r.startsWith(n+'='))?.split('=')[1];
}

loadDepartments();loadCategories();
</script>
</body>
</html>
