{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Officer Panel{% endblock %}</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #020617);
        }
    </style>
</head>

<body class="text-slate-200">
<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-72 bg-slate-900/80 backdrop-blur border-r border-slate-700 p-6">
        <div class="flex items-center gap-3 mb-10">
            <i data-lucide="shield" class="w-8 h-8 text-teal-400"></i>
            <div>
                <h2 class="font-bold text-lg">Officer Panel</h2>
                <p class="text-xs text-slate-400">Grievance System</p>
            </div>
        </div>

        <nav class="space-y-3">
            <a href="{% url 'officerpanel:dashboard' %}"
               class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">
                <i data-lucide="layout-dashboard"></i>
                Dashboard
            </a>

            <a href="{% url 'officerpanel:grievances_list' %}"
               class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">
                <i data-lucide="file-text"></i>
                My Grievances
            </a>

            <a href="{% url 'accounts:logout' %}"
               class="flex items-center gap-3 px-4 py-3 rounded-lg text-red-400 hover:bg-red-500/10 transition">
                <i data-lucide="log-out"></i>
                Logout
            </a>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 p-8">
        {% block content %}{% endblock %}
    </main>

</div>

<script>
    lucide.createIcons();
</script>
</body>
</html>
