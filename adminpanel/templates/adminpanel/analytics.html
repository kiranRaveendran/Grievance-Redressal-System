{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | Analytics</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:linear-gradient(180deg,#071124,#0a2f3a);
  color:#e6eef3;
  font-family:Inter,system-ui;
}
.app{display:flex;height:100vh}
.sidebar{width:260px;padding:24px}
.content{flex:1;padding:24px;display:flex;flex-direction:column;gap:20px}
.glass{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  backdrop-filter:blur(10px);
}
.sidebar nav a{
  display:flex;align-items:center;gap:12px;
  padding:10px;border-radius:10px;
  text-decoration:none;color:#e6eef3;
}
.sidebar nav a:hover{background:rgba(255,255,255,.1)}
.sidebar nav a.active{background:rgba(255,255,255,.15)}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{padding:18px;border-radius:16px;text-align:center;font-weight:600}
.card-total{background:#f59e0b;color:#1f2937}
.card-open{background:#06b6d4;color:#1f2937}
.card-resolved{background:#22c55e;color:#1f2937}
.card-avg{background:#6366f1;color:#fff}

.analytics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;flex:1}
.chart-box{height:240px}

@media(max-width:1100px){
  .sidebar{display:none}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .analytics-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar glass">
  <div class="flex items-center gap-3 mb-8">
    <img src="{% static 'images/favicon.ico' %}" width="40">
    <div>
      <div class="font-bold text-lg">Grievance Admin</div>
      <div class="text-xs opacity-70">Management Panel</div>
    </div>
  </div>

  <nav class="space-y-1">
    <a href="{% url 'adminpanel:dashboard' %}"><i data-lucide="layout-dashboard"></i>Dashboard</a>
    <a href="{% url 'adminpanel:grievances_list' %}"><i data-lucide="file-text"></i>Grievances</a>
    <a href="{% url 'adminpanel:categories' %}"><i data-lucide="layers"></i>Categories</a>
    <a href="{% url 'adminpanel:analytics' %}" class="active"><i data-lucide="bar-chart-2"></i>Analytics</a>
    <a href="{% url 'adminpanel:users' %}"><i data-lucide="users"></i>Users</a>
    <a href="{% url 'adminpanel:settings' %}"><i data-lucide="settings"></i>Settings</a>
    <a href="{% url 'logout' %}"><i data-lucide="log-out"></i>Logout</a>
  </nav>
</aside>

<main class="content">

<div class="glass p-4"><h2 class="text-xl font-bold">Analytics Overview</h2></div>

<div class="metrics">
  <div class="card card-total">Total<div id="total" class="text-3xl">0</div></div>
  <div class="card card-open">Open<div id="open" class="text-3xl">0</div></div>
  <div class="card card-resolved">Resolved<div id="resolved" class="text-3xl">0</div></div>
  <div class="card card-avg">Avg Days<div id="avg" class="text-3xl">0</div></div>
</div>

<div class="glass p-4 flex gap-4 items-center">
  <div class="bg-green-500 p-3 rounded-full"><i data-lucide="award"></i></div>
  <div>
    <div class="text-sm opacity-70">Top Performing Officer</div>
    <div id="topOfficer" class="text-lg font-semibold">—</div>
  </div>
</div>

<section class="analytics-grid">
  <div class="glass p-4">
    <h3 class="mb-3 font-semibold">Status Distribution</h3>
    <canvas id="statusChart"></canvas>
  </div>
  <div class="glass p-4">
    <h3 class="mb-3 font-semibold">Officer Performance</h3>
    <canvas id="officerChart"></canvas>
  </div>
  <div class="glass p-4">
    <h3 class="mb-3 font-semibold">Resolution Rate</h3>
    <canvas id="resolutionChart"></canvas>
  </div>
</section>

</main>
</div>

<script>
Chart.register(ChartDataLabels);

async function loadAnalytics(){
  const res = await fetch('/adminpanel/api/analytics/');
  const data = await res.json();

  total.textContent = data.total || data.summary?.total || 0;
  open.textContent = (data.pending||0)+(data.in_progress||0);
  resolved.textContent = data.resolved || 0;
  avg.textContent = data.avg_resolution_days ?? '—';

  // --- Normalize officer data ---
  let labels=[], assignedData=[], resolvedData=[];

  if(data.by_officer){
    data.by_officer.forEach(o=>{
      labels.push(o.name || o.username || 'Officer');
      assignedData.push(o.assigned || 0);
      resolvedData.push(o.resolved || 0);
    });
  }else if(data.officer_chart){
    labels = data.officer_chart.labels;
    resolvedData = data.officer_chart.data;
    assignedData = resolvedData.map(v=>v || 1);
  }

  // --- Top officer ---
  let max=0, top='—';
  resolvedData.forEach((v,i)=>{ if(v>max){max=v;top=labels[i]} });
  topOfficer.textContent = top;

  const colors = labels.map(l=>l===top?'#facc15':'#4ade80');

  // STATUS
  new Chart(statusChart,{
    type:'pie',
    data:{
      labels:['Pending','In Progress','Resolved'],
      datasets:[{data:[data.pending||0,data.in_progress||0,data.resolved||0],
        backgroundColor:['#f59e0b','#06b6d4','#22c55e']}]
    }
  });

  // OFFICER PERFORMANCE
  new Chart(officerChart,{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'Resolved',data:resolvedData,backgroundColor:colors,borderRadius:6},
        {label:'Assigned',data:assignedData,backgroundColor:'#60a5fa',borderRadius:6}
      ]
    },
    options:{
      scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true}},
      plugins:{
        datalabels:{
          color:'#fff',
          formatter:(v,ctx)=>{
            if(ctx.dataset.label!=='Resolved') return '';
            const a=assignedData[ctx.dataIndex]||1;
            return Math.round((v/a)*100)+'%';
          }
        }
      }
    },
    plugins:[ChartDataLabels]
  });

  // RESOLUTION RATE
  new Chart(resolutionChart,{
    type:'doughnut',
    data:{
      labels:['Resolved','Pending'],
      datasets:[{data:[data.resolved||0,(data.total||0)-(data.resolved||0)],
        backgroundColor:['#22c55e','#334155']}]
    },
    options:{cutout:'70%'}
  });
}

document.addEventListener('DOMContentLoaded',()=>{
  loadAnalytics();
  lucide.createIcons();
});
</script>
</body>
</html>
