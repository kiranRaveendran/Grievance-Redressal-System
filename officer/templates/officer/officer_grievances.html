{% extends "officer/base_officer.html" %}
{% load static %}

{% block title %}Officer Grievances{% endblock %}

{% block content %}
<div class="p-6 bg-gray-900 min-h-screen text-white">

<h1 class="text-2xl font-bold mb-6">Assigned Grievances</h1>

<!-- CATEGORY FILTER -->
<div class="mb-4">
    <label class="block mb-2 text-gray-300">Filter by Category</label>
    <select id="categorySelect"
        class="bg-gray-800 border border-gray-600 p-2 rounded w-64">
        <option value="">All Categories</option>
    </select>
</div>

<!-- TABLE -->
<div class="bg-gray-800 rounded-lg overflow-x-auto">
<table class="min-w-full text-left">
    <thead class="bg-gray-700">
        <tr>
            <th class="px-4 py-2">ID</th>
            <th class="px-4 py-2">Citizen</th>
            <th class="px-4 py-2">Category</th>
            <th class="px-4 py-2">Description</th>
            <th class="px-4 py-2">Status</th>
            <th class="px-4 py-2">Date</th>
        </tr>
    </thead>
    <tbody id="grievanceTable">
        <tr>
            <td colspan="6" class="text-center py-4 text-gray-400">
                Loading...
            </td>
        </tr>
    </tbody>
</table>
</div>

</div>

<script>
const API_URL = "{% url 'officer:get_grievances' %}";
const tableBody = document.getElementById("grievanceTable");
const categorySelect = document.getElementById("categorySelect");

function fetchGrievances(category="") {
    let url = API_URL;
    if (category) {
        url += "?category=" + category;
    }

    fetch(url, { credentials: "same-origin" })
        .then(res => res.json())
        .then(data => {
            renderCategories(data.categories);
            renderTable(data.grievances);
        });
}

function renderCategories(categories) {
    if (categorySelect.options.length > 1) return;

    categories.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat.id;
        opt.textContent = cat.name;
        categorySelect.appendChild(opt);
    });
}

function renderTable(grievances) {
    tableBody.innerHTML = "";

    if (!grievances.length) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="6" class="text-center py-4 text-gray-400">
                    No grievances found
                </td>
            </tr>`;
        return;
    }

    grievances.forEach(g => {
        tableBody.innerHTML += `
            <tr class="border-b border-gray-700">
                <td class="px-4 py-2">${g.id}</td>
                <td class="px-4 py-2">${g.citizen_name || "-"}</td>
                <td class="px-4 py-2">${g.category_name}</td>
                <td class="px-4 py-2">${g.description}</td>
                <td class="px-4 py-2 capitalize">${g.status}</td>
                <td class="px-4 py-2">${g.created_at}</td>
            </tr>
        `;
    });
}

categorySelect.addEventListener("change", () => {
    fetchGrievances(categorySelect.value);
});

fetchGrievances();
</script>
{% endblock %}
