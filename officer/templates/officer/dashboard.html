{% extends 'officer/base_officer.html' %}
{% load static %}

{% block content %}

<input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

<div class="p-6 bg-gray-900 min-h-screen text-white">

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold">Officer Dashboard</h1>
        <span id="officerName" class="text-xl text-gray-300">Officer</span>
    </div>

    <!-- STATUS BOXES -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
        <div class="bg-yellow-600 p-6 rounded-xl text-center">
            <h3>Pending</h3>
            <p id="count_pending" class="text-2xl font-bold">0</p>
        </div>
        <div class="bg-blue-600 p-6 rounded-xl text-center">
            <h3>In Progress</h3>
            <p id="count_inprogress" class="text-2xl font-bold">0</p>
        </div>
        <div class="bg-green-600 p-6 rounded-xl text-center">
            <h3>Resolved</h3>
            <p id="count_resolved" class="text-2xl font-bold">0</p>
        </div>
    </div>

    <!-- TABLE -->
    <div class="bg-gray-800 p-4 rounded-lg">
        <h2 class="text-xl mb-3">Grievances Assigned to You</h2>

        <table class="min-w-full text-left">
            <thead class="bg-gray-700">
                <tr>
                    <th class="px-4 py-2">ID</th>
                    <th class="px-4 py-2">Citizen</th>
                    <th class="px-4 py-2">Category</th>
                    <th class="px-4 py-2">Description</th>
                    <th class="px-4 py-2">Status</th>
                </tr>
            </thead>
            <tbody id="grievanceTable">
                <tr>
                    <td colspan="5" class="text-center py-4 text-gray-400">
                        Loading...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const tableBody = document.getElementById("grievanceTable");
    let grievances = [];

    function getCSRFToken() {
        return document.querySelector('[name=csrfmiddlewaretoken]').value;
    }

    /* FETCH OFFICER NAME */
    fetch("/officer/dashboard/api/")
        .then(res => res.json())
        .then(data => {
            document.getElementById("officerName").innerText =
                data.name || "Officer";
        });

    /* FETCH GRIEVANCES */
    fetch("/officer/get_grievances/")
        .then(res => res.json())
        .then(data => {
            grievances = data.grievances || [];
            renderTable();
            updateCounts();
        });

    function renderTable() {
        tableBody.innerHTML = "";

        if (!grievances.length) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center py-4 text-gray-400">
                        No grievances found
                    </td>
                </tr>`;
            return;
        }

        grievances.forEach(g => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td class="px-4 py-2">${g.id}</td>
                <td class="px-4 py-2">${g.citizen_name}</td>
                <td class="px-4 py-2">${g.category_name}</td>
                <td class="px-4 py-2">${g.description}</td>
                <td class="px-4 py-2">
                    <select
                        class="bg-gray-800 border border-gray-600 px-2 py-1 rounded"
                        onchange="updateStatus(${g.id}, this.value)">
                        <option value="new" ${g.status === "new" ? "selected" : ""}>
                            Pending
                        </option>
                        <option value="in_progress" ${g.status === "in_progress" ? "selected" : ""}>
                            In Progress
                        </option>
                        <option value="resolved" ${g.status === "resolved" ? "selected" : ""}>
                            Resolved
                        </option>
                    </select>
                </td>
                
            `;
            tableBody.appendChild(row);
        });
    }

    function updateCounts() {
        let counts = { new: 0, in_progress: 0, resolved: 0 };

        grievances.forEach(g => {
            if (counts[g.status] !== undefined) {
                counts[g.status]++;
            }
        });

        document.getElementById("count_pending").innerText = counts.new;
        document.getElementById("count_inprogress").innerText = counts.in_progress;
        document.getElementById("count_resolved").innerText = counts.resolved;
    }

    window.updateStatus = function (grievanceId, statusValue) {
        fetch("/officer/update-grievance-status/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCSRFToken()
            },
            body: JSON.stringify({
                grievance_id: grievanceId,
                status: statusValue
            })
        })
        .then(res => {
            if (!res.ok) throw new Error("Failed");
            return res.json();
        })
        .then(data => {
            const g = grievances.find(x => x.id === grievanceId);
            if (g) g.status = statusValue;

            updateCounts();
            renderTable();
        })
        .catch(err => {
            alert("Status updation failed");
            console.error(err);
        });
    };

});
</script>
{% endblock %}
