{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin | Grievance Detail</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
body {
  background:
    radial-gradient(circle at top,#14b8a633,transparent 45%),
    linear-gradient(180deg,#020617,#031f1c);
  color:#e5e7eb;
  font-family:Inter,system-ui;
}
.glass {
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
  backdrop-filter: blur(16px);
}
.card { transition:.3s; }
.card:hover {
  transform: translateY(-6px);
  box-shadow:0 25px 50px rgba(0,0,0,.6);
}
.badge {
  padding: .25rem .6rem;
  border-radius: .5rem;
  font-size:.75rem;
}
.b-new { background:#f59e0b22;color:#fbbf24; }
.b-in_progress { background:#0ea5a422;color:#2dd4bf; }
.b-resolved { background:#10b98122;color:#34d399; }
</style>
</head>

<body class="p-6">

<!-- Back link (NO underline) -->
<a href="{% url 'adminpanel:grievances_list' %}"
   class="text-teal-400 hover:text-teal-300 mb-6 inline-block"
   style="text-decoration:none;">
   &larr; Back to Grievances
</a>

<!-- Center Wrapper -->
<div class="flex justify-center">
  <div class="w-full max-w-3xl">

    <h1 class="text-2xl font-bold mb-6 text-center">
      Grievance Detail
    </h1>

    <!-- Grievance Details -->
    <div id="grievanceDetails" class="glass p-6 rounded-xl space-y-3">
      <p><strong>Grievance ID:</strong> <span id="gId">#GRV...</span></p>
      <p><strong>Title:</strong> <span id="gTitle">Loading...</span></p>
      <p><strong>Description:</strong> <span id="gDesc">Loading...</span></p>
      <p><strong>Category:</strong> <span id="gCategory">-</span></p>
      <p><strong>Status:</strong> <span id="gStatus" class="badge">-</span></p>
      <p><strong>Submitted By:</strong> <span id="gUser">-</span></p>
      <p><strong>Submitted On:</strong> <span id="gCreated">-</span></p>
      <p><strong>Assigned Officer:</strong> <span id="gOfficer">Not Assigned</span></p>
    </div>

    <!-- Add Remark -->
    <div class="mt-6 glass p-4 rounded-xl">
      <h3 class="font-semibold mb-2">Add Remark</h3>
      <textarea id="remarkInput"
        class="w-full p-2 rounded bg-black/20 border border-white/10"
        rows="3"
        placeholder="Type remark here..."></textarea>
      <button onclick="addRemark()"
        class="mt-2 px-4 py-1 bg-teal-500 rounded text-black">
        Add Remark
      </button>
    </div>

    <!-- Remarks List -->
    <div class="mt-4">
      <h3 class="font-semibold mb-2">Remarks</h3>
      <ul id="remarksList" class="space-y-2"></ul>
    </div>

  </div>
</div>

<script>
const grievanceId = {{ grievance_id }};
const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

function loadGrievance() {
  fetch(`/adminpanel/api/grievances/${grievanceId}/`)
    .then(r => r.json())
    .then(data => {
      document.getElementById("gId").textContent = "#GRV" + data.id;
      document.getElementById("gTitle").textContent = data.title || "-";
      document.getElementById("gDesc").textContent = data.description || "-";
      document.getElementById("gCategory").textContent = data.category || "-";

      const statusEl = document.getElementById("gStatus");
      statusEl.textContent = data.status || "-";
      statusEl.className = "badge b-" + (data.status || "new");

      document.getElementById("gUser").textContent = data.submitted_by || "-";
      document.getElementById("gCreated").textContent = data.created_at || "-";
      document.getElementById("gOfficer").textContent =
        data.assigned_officer || "Not Assigned";

      const ul = document.getElementById("remarksList");
      ul.innerHTML = "";

      if (data.remarks && data.remarks.length > 0) {
        data.remarks.forEach(r => {
          const li = document.createElement("li");
          li.className = "glass p-2 rounded";
          li.innerHTML = `
            <strong>${r.officer_name}</strong>
            <span class="text-gray-400 text-xs">(${r.created_at})</span><br>
            ${r.remark}
          `;
          ul.appendChild(li);
        });
      } else {
        ul.innerHTML =
          "<li class='text-gray-400'>No remarks yet</li>";
      }
    })
    .catch(err => console.error(err));
}

function addRemark() {
  const remarkText =
    document.getElementById("remarkInput").value.trim();
  if (!remarkText) return alert("Enter remark");

  fetch(`/adminpanel/api/grievances/${grievanceId}/remarks/`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": csrfToken
    },
    body: JSON.stringify({ remark: remarkText })
  })
  .then(r => r.json())
  .then(() => {
    document.getElementById("remarkInput").value = "";
    loadGrievance();
  })
  .catch(err => {
    console.error(err);
    alert("Failed to add remark.");
  });
}

document.addEventListener("DOMContentLoaded", loadGrievance);
</script>

<script>lucide.createIcons();</script>
</body>
</html>
